name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#定时任务每天晚上12点执行


#[vars]
#orm_log = false
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串
#oidc_switch = false		#是否启用OIDC登录
#oidc_name = "统一身份认证"	#登录按钮名称
#oidc_issuer = ""			#OIDC签发者地址 示例: https://ums.example.com
#oidc_client_id = ""		#OIDC客户端ID
#oidc_client_secret = ""	#OIDC客户端密钥
#oidc_callback_url = ""		#OIDC回调地址 示例: https://mail.example.com/login
#oidc_scope = "openid profile email"
#oidc_authorize_url = ""	#可选，默认 oidc_issuer + /oauth2/authorize
#oidc_token_url = ""		#可选，默认 oidc_issuer + /oauth2/token
#oidc_userinfo_url = ""		#可选，默认 oidc_issuer + /oauth2/userinfo

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
